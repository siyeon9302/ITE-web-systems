<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
    table {
      width: 60%;
      border-collapse: collapse;
      margin: 20px auto;
      text-align: left;
    }

    caption {
      font-size: 1.5em;
      font-weight: bold;
      margin-bottom: 10px;
    }

    th{
      text-align: center;
    }

    th, td {
      border: 1px solid #888;
      padding: 8px 12px;
    }

    thead {
      background-color: #bdaee3;
    }

    tbody tr:nth-child(even) {
      background-color: #f0eff8;
    }

    tbody tr:nth-child(odd) {
      background-color: #ffffff;
    }

    tfoot td {
      text-align: center;
      font-style: italic;
      background-color: #f0eff8;
    }
  </style>
  </head>

    </table>
  </body>
</html>
